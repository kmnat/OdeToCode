<div class="card-container">
    <mat-card class="login-card" appearance="outlined">
      <mat-card-header class="header">
        <mat-card-title>Login / Sign Up</mat-card-title>
        <mat-button-toggle-group name="role" appearance="legacy">
          <mat-button-toggle value="grad">Grad</mat-button-toggle>
          <mat-button-toggle value="manager">Program Manager</mat-button-toggle>
        </mat-button-toggle-group>
      </mat-card-header>
  
      <mat-card-content>
        <form class="login-form">
          <mat-form-field appearance="fill">
            <mat-label>Username or Email</mat-label>
            <input matInput placeholder="Enter your username">
          </mat-form-field>
  
          <mat-form-field appearance="fill">
            <mat-label>Role</mat-label>
            <mat-select>
              <mat-option value="one">First option</mat-option>
              <mat-option value="two">Second option</mat-option>
            </mat-select>
          </mat-form-field>
  
          <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput placeholder="Write something..."></textarea>
          </mat-form-field>
        </form>
      </mat-card-content>
  
      <mat-card-actions align="end">
        <button mat-flat-button color="primary">Login</button>
        <button mat-stroked-button color="accent">Sign Up</button>
      </mat-card-actions>
    </mat-card>
  </div>
