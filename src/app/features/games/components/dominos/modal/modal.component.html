<h2 mat-dialog-title>🧩 Puzzle Time</h2>
    <mat-dialog-content>
      <p>{{ data.puzzle.question }}</p>
      <mat-form-field appearance="fill" class="full-width">
        <input matInput placeholder="Your answer..." [(ngModel)]="userAnswer" />
      </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-raised-button color="accent" (click)="submit()">Submit</button>
    </mat-dialog-actions>
